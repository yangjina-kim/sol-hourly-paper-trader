name: Hourly SOL/KRW AI Paper Trader

on:
  schedule:
    # 매시간 정각 5분 뒤 실행 (1시간봉 마감 직후, UTC/KST 동일하게 매시 05분)
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      force_quant:
        description: "Gemini API를 건너뛰고 정량 멀티팩터 전략으로 실행"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "파일 저장 및 배포 없이 시뮬레이션 결과만 미리보기"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "sol-hourly-paper-trader"
  cancel-in-progress: false

jobs:
  trade:
    name: Run Hourly Trading Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute hourly trading cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          ARGS=""
          if [ "${{ inputs.force_quant }}" = "true" ]; then
            ARGS="$ARGS --force-quant"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 -m src.run_cycle $ARGS

      - name: Commit cumulative ledger and dashboard data
        if: ${{ inputs.dry_run != true && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/dashboard.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          TS_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d %H:%M KST")
          git commit -m "chore(trade): hourly SOL/KRW briefing (${TS_KST}) [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Configure GitHub Pages
        if: ${{ inputs.dry_run != true && github.event.inputs.dry_run != 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: ${{ inputs.dry_run != true && github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy Dashboard to GitHub Pages
    needs: trade
    if: ${{ inputs.dry_run != true && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
